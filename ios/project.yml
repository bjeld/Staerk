name: Staerk
options:
  bundleIdPrefix: com.bjeld.apps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  defaultConfig: Debug
  developmentLanguage: da
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Staerk:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Staerk
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bjeld.apps.staerk
        PRODUCT_NAME: Staerk
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: Staerk/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Staerk/Staerk.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Styrke
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        SWIFT_STRICT_CONCURRENCY: targeted
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    entitlements:
      path: Staerk/Staerk.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Staerk/Info.plist
      properties:
        CFBundleDisplayName: Styrke
        CFBundleName: Styrke
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen:
          UIColorName: StaerkBg
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: Staerk laeser skridt, gang- og loebeafstand, aktiv energi, traeningspas (herunder golf) og kropsvaegt fra Apple Sundhed, saa dagens aktivitet kan vises paa oversigten.
        NSHealthUpdateUsageDescription: Staerk gemmer styrketraening og kropsvaegt i Apple Sundhed, saa dine pas og din vaegt haenger sammen med Fitness og Sundhed.
        NSCameraUsageDescription: Staerk bruger kameraet til fremskridtsfotos, saa du kan sammenligne din krop over tid.
    dependencies:
      - sdk: HealthKit.framework
    scheme:
      testTargets:
        - StaerkTests
      storeKitConfiguration: ""
  StaerkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StaerkTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bjeld.apps.staerk.tests
        PRODUCT_NAME: StaerkTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Staerk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Staerk"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: targeted
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - target: Staerk
