<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STÆRK" />
    <meta name="description" content="Personlig styrke- og vaneapp til Martin — træning, kreatin, vand og fremskridt. Data bliver på din telefon." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>STÆRK — Martin</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('staerk-theme') || 'system'
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
        var blockPinch = function (e) {
          e.preventDefault()
        }
        document.addEventListener('gesturestart', blockPinch, { passive: false })
        document.addEventListener('gesturechange', blockPinch, { passive: false })
        document.addEventListener('gestureend', blockPinch, { passive: false })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
